<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Special</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=JetBrains+Mono&display=swap');
        body { background: black; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow { text-shadow: 0 0 20px rgba(168, 85, 247, 0.5); }
        .particle { position: absolute; background: rgba(255, 255, 255, 0.2); border-radius: 50%; pointer-events: none; animation: float 15s infinite linear; }
        @keyframes float {
            0% { transform: translateY(0) scale(0); opacity: 0; }
            50% { opacity: 0.5; transform: translateY(-50vh) scale(1); }
            100% { transform: translateY(-100vh) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="countdown-screen" class="w-full h-screen flex flex-col items-center justify-center relative z-50">
        <div class="text-center z-10">
            <h2 class="text-xs tracking-[0.5em] text-purple-300/50 mb-4 uppercase">Eternal Aura</h2>
            <h1 class="text-6xl font-black italic mb-12 glow">Something <br><span class="text-purple-400">Special</span></h1>

            <div class="flex gap-4 justify-center">
                <div class="flex flex-col items-center">
                    <div id="d" class="glass w-20 h-24 rounded-2xl flex items-center justify-center text-4xl font-mono font-bold">00</div>
                    <span class="text-[10px] mt-2 opacity-40">DAYS</span>
                </div>
                <div class="flex flex-col items-center">
                    <div id="h" class="glass w-20 h-24 rounded-2xl flex items-center justify-center text-4xl font-mono font-bold">00</div>
                    <span class="text-[10px] mt-2 opacity-40">HOURS</span>
                </div>
                <div class="flex flex-col items-center">
                    <div id="m" class="glass w-20 h-24 rounded-2xl flex items-center justify-center text-4xl font-mono font-bold">00</div>
                    <span class="text-[10px] mt-2 opacity-40">MIN</span>
                </div>
                <div class="flex flex-col items-center">
                    <div id="s" class="glass w-20 h-24 rounded-2xl flex items-center justify-center text-4xl font-mono font-bold">00</div>
                    <span class="text-[10px] mt-2 opacity-40">SEC</span>
                </div>
            </div>
            <p class="mt-20 opacity-30 tracking-[0.5em] text-xs">10.08.2026</p>
        </div>
    </div>

    <div id="main-content" class="hidden fixed inset-0 w-full h-screen bg-black flex flex-col items-center justify-center z-[100]">
        <div class="text-center px-6">
            <h1 class="text-4xl text-purple-400 font-extrabold mb-4 glow">SURPRISE UNLOCKED! 🎁</h1>
            <p class="text-white/60 text-lg mb-12">Happy Birthday! Finally, the wait is over.</p>
            
            <audio id="bgMusic" src="birthday_song.mp3" loop></audio>
            
            <button onclick="playMusic()" class="px-8 py-4 bg-purple-600 rounded-full font-bold text-lg tracking-wide hover:bg-purple-500 shadow-lg transition-all">
                Start Experience ✨
            </button>
        </div>
    </div>

    <script>
        const targetDate = new Date('August 10, 2026 00:00:00').getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff <= 0) {
                document.getElementById('countdown-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                return;
            }

            document.getElementById('d').innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
            document.getElementById('h').innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            document.getElementById('m').innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            document.getElementById('s').innerText = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
        }

        function playMusic() {
            const music = document.getElementById('bgMusic');
            music.play().catch(error => alert("Gana missing hai ya upload nahi hua!"));
        }

        setInterval(updateTimer, 1000);
        updateTimer();

        // Stars animation logic
        for(let i=0; i<30; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.top = Math.random() * 100 + 'vh';
            p.style.width = p.style.height = (Math.random() * 4 + 1) + 'px';
            p.style.animationDelay = (Math.random() * 10) + 's';
            document.body.appendChild(p);
        }
    </script>
</body>
</html>
